      { id: 'euronext', name: 'Euronext', krName: '유로넥스트', file: 'euronext.md', country: 'Europe', krCountry: '범유럽', flag: '🇪🇺', region: 'Europe', krRegion: '유럽', engine: 'Optiq Platform' },
      { id: 'deutsche_borse', name: 'Deutsche Börse (Xetra)', krName: '독일거래소', file: 'deutsche_borse.md', country: 'Germany', krCountry: '독일', flag: '🇩🇪', region: 'Europe', krRegion: '유럽', engine: 'T7 Architecture' },
      { id: 'six', name: 'SIX Swiss', krName: '스위스거래소', file: 'six.md', country: 'Switzerland', krCountry: '스위스', flag: '🇨🇭', region: 'Europe', krRegion: '유럽', engine: 'SwissAtMid & OREX' },
      { id: 'borsa_italiana', name: 'Borsa Italiana', krName: '이탈리아거래소', file: 'borsa_italiana.md', country: 'Italy', krCountry: '이탈리아', flag: '🇮🇹', region: 'Europe', krRegion: '유럽', engine: 'Optiq Engine' },
      { id: 'bme', name: 'BME', krName: '스페인거래소', file: 'bme.md', country: 'Spain', krCountry: '스페인', flag: '🇪🇸', region: 'Europe', krRegion: '유럽', engine: 'SIBE System' },
      { id: 'nasdaq_nordic', name: 'Nasdaq Nordic', krName: '나스닥 노르딕', file: 'nasdaq_nordic.md', country: 'Nordic', krCountry: '북유럽', flag: '🇸🇪', region: 'Europe', krRegion: '유럽', engine: 'INET Nordic' },
      
      // Emerging & Middle East
      { id: 'nse_india', name: 'NSE India', krName: '인도국립증권거래소', file: 'nse_india.md', country: 'India', krCountry: '인도', flag: '🇮🇳', region: 'Emerging & Middle East', krRegion: '신흥국 & 중동', engine: 'NEAT+ Platform' },
      { id: 'bse', name: 'BSE', krName: '봄베이증권거래소', file: 'bse.md', country: 'India', krCountry: '인도', flag: '🇮🇳', region: 'Emerging & Middle East', krRegion: '신흥국 & 중동', engine: 'BOLT Plus' },
      { id: 'jse', name: 'JSE', krName: '요하네스버그거래소', file: 'jse.md', country: 'South Africa', krCountry: '남아공', flag: '🇿🇦', region: 'Emerging & Middle East', krRegion: '신흥국 & 중동', engine: 'MillenniumIT' },
      { id: 'tadawul', name: 'Saudi Tadawul', krName: '사우디 타다울', file: 'tadawul.md', country: 'Saudi Arabia', krCountry: '사우디', flag: '🇸🇦', region: 'Emerging & Middle East', krRegion: '신흥국 & 중동', engine: 'Nasdaq X-Stream' },

      // Special Regulatory Documents
      { id: 'NASDAQ_OPTIONS_RULES', name: 'NASDAQ Options Rules', krName: '나스닥 옵션 규정집', file: 'NASDAQ_OPTIONS_RULES.md', country: 'United States', krCountry: '미국', flag: '📘', region: 'Special Regulations', krRegion: '특별 규정집', engine: 'NOM Rules 208P' }
    ];

    // Current Application State
    let currentId = 'nasdaq';
    let currentLang = localStorage.getItem('preferredLang') || 'ko'; // default: 'ko'
    let currentFontSize = parseInt(localStorage.getItem('docFontSize')) || 15;

    // Marked Standard Configuration (Do NOT override table method directly to avoid [object Object]undefined)
    marked.setOptions({
      gfm: true,
      breaks: false,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });

    // Language Toggle Handling
    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('preferredLang', lang);

      // Update UI button states
      const koBtn = document.getElementById('lang-ko-btn');
      const enBtn = document.getElementById('lang-en-btn');
      if (currentLang === 'ko') {
        koBtn.className = 'px-2 py-1 rounded-md bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-400 shadow-sm transition-all flex items-center gap-1';
        enBtn.className = 'px-2 py-1 rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all flex items-center gap-1';
        document.getElementById('badge-lang-indicator').textContent = '한국어';
        document.getElementById('sidebar-title').textContent = '글로벌 거래소 목록';
        document.getElementById('sidebar-search').placeholder = '거래소, 국가, 엔진 검색...';
        document.getElementById('toc-btn-text').textContent = '목차 (TOC)';
        document.getElementById('share-btn-text').textContent = '공유';
        document.getElementById('toc-modal-title').textContent = '문서 목차 (Table of Contents)';
        document.getElementById('loading-text').textContent = '데이터를 불러오는 중입니다...';
      } else {
        enBtn.className = 'px-2 py-1 rounded-md bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-400 shadow-sm transition-all flex items-center gap-1';
        koBtn.className = 'px-2 py-1 rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all flex items-center gap-1';
        document.getElementById('badge-lang-indicator').textContent = 'English';
        document.getElementById('sidebar-title').textContent = 'Global Exchanges';
        document.getElementById('sidebar-search').placeholder = 'Search exchange, country, engine...';
        document.getElementById('toc-btn-text').textContent = 'TOC';
        document.getElementById('share-btn-text').textContent = 'Share';
        document.getElementById('toc-modal-title').textContent = 'Table of Contents';
        document.getElementById('loading-text').textContent = 'Loading document...';
      }

      // Re-render sidebar with updated language priority
      renderSidebar(document.getElementById('sidebar-search').value);

      // Reload current exchange content
      loadExchange(currentId);
    }

    // Group Exchanges by Region
    function getGroupedExchanges() {
      const groups = {};
      EXCHANGES.forEach(ex => {
        const regionKey = currentLang === 'ko' ? ex.krRegion : ex.region;
        if (!groups[regionKey]) groups[regionKey] = [];
        groups[regionKey].push(ex);
      });
      return groups;
    }

    // Render Sidebar Navigation
    function renderSidebar(filterText = '') {
      const navList = document.getElementById('nav-list');
      const grouped = getGroupedExchanges();
      let html = '';

      const query = filterText.toLowerCase().trim();

      for (const [region, items] of Object.entries(grouped)) {
        const filtered = items.filter(ex => 
          ex.name.toLowerCase().includes(query) || 
          ex.krName.toLowerCase().includes(query) || 
          ex.country.toLowerCase().includes(query) || 
          ex.krCountry.toLowerCase().includes(query) ||
          ex.engine.toLowerCase().includes(query)
        );

        if (filtered.length === 0) continue;

        html += `<div class="space-y-1">
          <div class="px-2 py-1 text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">${region}</div>
          <div class="space-y-0.5">`;

        filtered.forEach(ex => {
          const isActive = ex.id === currentId;
          const activeClasses = isActive 
            ? 'bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 font-semibold border-l-2 border-sky-500' 
            : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60';

          const primaryName = currentLang === 'ko' ? `${ex.krName} <span class="text-[10px] text-slate-400 font-normal">(${ex.name})</span>` : `${ex.name} <span class="text-[10px] text-slate-400 font-normal">(${ex.krName})</span>`;
          const secondaryInfo = currentLang === 'ko' ? `${ex.krCountry}` : `${ex.country}`;

          html += `
            <a href="#/${ex.id}?lang=${currentLang}" class="flex items-center justify-between px-2.5 py-2 rounded-md transition-all ${activeClasses} group">
              <div class="flex items-center space-x-2 truncate">
                <span class="text-sm">${ex.flag}</span>
                <div class="truncate">
                  <div class="truncate leading-tight">${primaryName}</div>
                  <div class="text-[10px] text-slate-400 font-normal truncate">${secondaryInfo} · ${ex.engine.split(' ')[0]}</div>
                </div>
              </div>
              <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300 truncate max-w-[70px]">${ex.id.toUpperCase()}</span>
            </a>
          `;
        });

        html += `</div></div>`;
      }

      if (html === '') {
        html = `<div class="p-4 text-center text-slate-400 text-xs">${currentLang === 'ko' ? '일치하는 거래소가 없습니다.' : 'No exchanges found.'}</div>`;
      }

      navList.innerHTML = html;
    }

    // Load and Render Markdown Document
    async function loadExchange(id) {
      const ex = EXCHANGES.find(e => e.id === id) || EXCHANGES[0];
      currentId = ex.id;
      window.location.hash = `/${ex.id}?lang=${currentLang}`;

      // Update Header Badges
      const displayName = currentLang === 'ko' ? `${ex.krName} (${ex.name})` : `${ex.name} (${ex.krName})`;
      document.getElementById('current-exchange-name').textContent = displayName;
      document.getElementById('badge-country').textContent = ex.flag;
      document.getElementById('badge-code').textContent = ex.id.toUpperCase();
      document.getElementById('badge-engine').textContent = ex.engine;
      document.title = `${ex.name} - Global Exchange Architecture`;

      // Update Sidebar active state
      renderSidebar(document.getElementById('sidebar-search').value);

      // Close mobile sidebar if open
      closeSidebar();

      // Show Loading
      const loading = document.getElementById('loading');
      const body = document.getElementById('markdown-body');
      loading.classList.remove('hidden');
      body.classList.add('hidden');

      // Resolve file path based on language
      let targetFile = '';
      if (currentLang === 'ko') {
        targetFile = `ko/${ex.file}`;
      } else {
        targetFile = `en/${ex.file}`;
      }

      try {
        let response = await fetch(targetFile);
        if (!response.ok) {
          // Fallback to root directory if subfolder fetch fails
          response = await fetch(ex.file);
          if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load ${targetFile}`);
        }
        const markdown = await response.text();

        // 1. Parse markdown using standard marked parser (Clean output, no [object Object]undefined)
        body.innerHTML = marked.parse(markdown);

        // 2. Safe DOM Post-processing: Wrap all <table> elements in responsive scrollable container
        body.querySelectorAll('table').forEach(table => {
          if (!table.parentElement.classList.contains('table-container')) {
            const wrapper = document.createElement('div');
            wrapper.className = 'table-container';
            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);
          }
        });

        // 3. Render KaTeX math in markdown body
        renderMathInElement(body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });

        // 4. Build Table of Contents
        buildTOC();

        loading.classList.add('hidden');
        body.classList.remove('hidden');

        // Scroll to top of document
        document.getElementById('main-scroll-container').scrollTop = 0;

        // Refresh Lucide icons
        lucide.createIcons();

      } catch (err) {
        loading.classList.add('hidden');
        body.classList.remove('hidden');
        body.innerHTML = `
          <div class="p-6 rounded-xl border border-red-200 bg-red-50 dark:bg-red-950/30 dark:border-red-900/50 text-red-600 dark:text-red-400">
            <h3 class="font-bold text-base mb-2">${currentLang === 'ko' ? '문서를 불러오지 못했습니다' : 'Failed to load document'}</h3>
            <p class="text-xs mb-3 font-mono">${err.message}</p>
            <p class="text-xs text-slate-500">${currentLang === 'ko' ? 'GitHub Pages 정적 호스팅 또는 로컬 HTTP 서버 환경에서 열람 가능합니다.' : 'Please open via GitHub Pages or a local HTTP server.'}</p>
          </div>
        `;
      }
    }

    // Build Table of Contents
    function buildTOC() {
      const body = document.getElementById('markdown-body');
      const headings = body.querySelectorAll('h1, h2, h3');
      const tocContainer = document.getElementById('toc-content');
      
      if (headings.length === 0) {
        tocContainer.innerHTML = `<p class="text-slate-400 text-center py-4">${currentLang === 'ko' ? '목차가 없습니다.' : 'No headings found.'}</p>`;
        return;
      }

      let html = '';
      headings.forEach((heading, idx) => {
        const id = 'heading-' + idx;
        heading.id = id;
        const level = heading.tagName.toLowerCase();
        const indent = level === 'h1' ? 'font-bold text-slate-900 dark:text-white pt-1' : (level === 'h2' ? 'pl-3 font-semibold text-sky-600 dark:text-sky-400' : 'pl-6 text-slate-500');

        html += `
          <a href="#${id}" class="block py-1 px-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors ${indent} truncate" onclick="closeTOC();">
            ${heading.textContent}
          </a>
        `;
      });

      tocContainer.innerHTML = html;
    }

    // Global Search Modal Logic
    function setupGlobalSearch() {
      const searchTrigger = document.getElementById('btn-search-trigger');
      const searchModal = document.getElementById('search-modal');
      const searchClose = document.getElementById('btn-close-search');
      const searchInput = document.getElementById('global-search-input');
      const searchResults = document.getElementById('global-search-results');

      function openSearch() {
        searchModal.classList.remove('hidden');
        searchInput.value = '';
        renderSearchResults('');
        setTimeout(() => searchInput.focus(), 50);
      }

      function closeSearch() {
        searchModal.classList.add('hidden');
      }

      function renderSearchResults(q) {
        const query = q.toLowerCase().trim();
        const matches = EXCHANGES.filter(ex => 
          ex.name.toLowerCase().includes(query) ||
          ex.krName.toLowerCase().includes(query) ||
          ex.country.toLowerCase().includes(query) ||
          ex.krCountry.toLowerCase().includes(query) ||
          ex.engine.toLowerCase().includes(query) ||
          ex.region.toLowerCase().includes(query) ||
          ex.krRegion.toLowerCase().includes(query)
        );

        if (matches.length === 0) {
          searchResults.innerHTML = `<div class="p-4 text-center text-slate-400">${currentLang === 'ko' ? '검색 결과가 없습니다.' : 'No results found.'}</div>`;
          return;
        }

        searchResults.innerHTML = matches.map(ex => `
          <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition-colors"
               onclick="loadExchange('${ex.id}'); document.getElementById('search-modal').classList.add('hidden');">
            <div class="flex items-center space-x-3 truncate">
              <span class="text-xl">${ex.flag}</span>
              <div class="truncate">
                <div class="font-bold text-slate-800 dark:text-slate-100 text-xs">${ex.name} <span class="text-slate-400 font-normal">(${ex.krName})</span></div>
                <div class="text-[10px] text-slate-400">${currentLang === 'ko' ? ex.krCountry : ex.country} · ${ex.engine}</div>
              </div>
            </div>
            <span class="font-mono text-[10px] px-2 py-0.5 rounded bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 border border-sky-500/20">${ex.id.toUpperCase()}</span>
          </div>
        `).join('');
      }

      searchTrigger.addEventListener('click', openSearch);
      searchClose.addEventListener('click', closeSearch);
      searchModal.addEventListener('click', (e) => {
        if (e.target === searchModal) closeSearch();
      });

      searchInput.addEventListener('input', (e) => {
        renderSearchResults(e.target.value);
      });

      // Keyboard Shortcut (Cmd+K / Ctrl+K)
      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          openSearch();
        }
        if (e.key === 'Escape' && !searchModal.classList.contains('hidden')) {
          closeSearch();
        }
      });
    }

    // Sidebar Mobile Controls
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sidebarBackdrop.classList.remove('hidden');
    }
    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      sidebarBackdrop.classList.add('hidden');
    }

    // TOC Modal Controls
    const tocModal = document.getElementById('toc-modal');
    function openTOC() { tocModal.classList.remove('hidden'); }
    function closeTOC() { tocModal.classList.add('hidden'); }

    // Theme Toggle Logic
    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      lucide.createIcons();
    }

    // Font Size Controls
    function setFontSize(size) {
      currentFontSize = size;
      document.getElementById('markdown-body').style.fontSize = `${currentFontSize}px`;
      localStorage.setItem('docFontSize', size);
    }

    // Event Listeners Registration
    document.getElementById('lang-ko-btn').addEventListener('click', () => setLanguage('ko'));
    document.getElementById('lang-en-btn').addEventListener('click', () => setLanguage('en'));

    document.getElementById('btn-toggle-sidebar').addEventListener('click', openSidebar);
    document.getElementById('btn-close-sidebar').addEventListener('click', closeSidebar);
    sidebarBackdrop.addEventListener('click', closeSidebar);

    document.getElementById('btn-toc-toggle').addEventListener('click', openTOC);
    document.getElementById('btn-close-toc').addEventListener('click', closeTOC);
    tocModal.addEventListener('click', (e) => { if (e.target === tocModal) closeTOC(); });

    document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme);

    document.getElementById('font-decrease').addEventListener('click', () => setFontSize(Math.max(12, currentFontSize - 1)));
    document.getElementById('font-reset').addEventListener('click', () => setFontSize(15));
    document.getElementById('font-increase').addEventListener('click', () => setFontSize(Math.min(20, currentFontSize + 1)));

    // Sidebar Search input
    document.getElementById('sidebar-search').addEventListener('input', (e) => {
      renderSidebar(e.target.value);
    });

    // Copy Link Button
    document.getElementById('btn-copy-link').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert(currentLang === 'ko' ? '문서 링크가 클립보드에 복사되었습니다!' : 'Document URL copied to clipboard!');
      });
    });

    // Scroll to Top Button Visibility
    const scrollContainer = document.getElementById('main-scroll-container');
    const scrollTopBtn = document.getElementById('btn-scroll-top');
    scrollContainer.addEventListener('scroll', () => {
      if (scrollContainer.scrollTop > 300) {
        scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      } else {
        scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }
    });
    scrollTopBtn.addEventListener('click', () => {
      scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Hash Route Listener
    window.addEventListener('hashchange', () => {
      parseUrlHash();
    });

    function parseUrlHash() {
      const hashStr = window.location.hash.replace('#/', '');
      if (!hashStr) {
        loadExchange('nasdaq');
        return;
      }
      const [id, queryStr] = hashStr.split('?');
      if (queryStr) {
        const params = new URLSearchParams(queryStr);
        const lang = params.get('lang');
        if (lang && (lang === 'ko' || lang === 'en') && lang !== currentLang) {
          currentLang = lang;
        }
      }
      if (id && EXCHANGES.some(e => e.id === id)) {
        if (id !== currentId) {
          loadExchange(id);
        }
      }
    }

    // Initialize App on DOM Ready
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupGlobalSearch();

      // Restore Theme
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
      }

      // Restore Font Size
      setFontSize(currentFontSize);

      // Check URL hash for initial exchange and language
      const hashStr = window.location.hash.replace('#/', '');
      if (hashStr) {
        const [id, queryStr] = hashStr.split('?');
        if (queryStr) {
          const params = new URLSearchParams(queryStr);
          const lang = params.get('lang');
          if (lang && (lang === 'ko' || lang === 'en')) {
            currentLang = lang;
          }
        }
        if (id && EXCHANGES.some(e => e.id === id)) {
          currentId = id;
        }
      }

      // Set initial language UI
      setLanguage(currentLang);
    });
  </script>
